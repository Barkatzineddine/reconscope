[global]
    workgroup = LAB
    server string = reconscope lab smb
    # Deliberately insecure settings so reconscope reports them:
    server min protocol = NT1
    client min protocol = NT1
    server signing = auto
    smb ports = 445
    log level = 1
    security = user
    map to guest = Bad User

[public]
    path = /srv/public
    browseable = yes
    read only = yes
    guest ok = yes
