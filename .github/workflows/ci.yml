name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; each job asks only for what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Third-party tools are pinned to an exact version and image digest.
  GITLEAKS: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  PYTHONUTF8: "1"

jobs:
  secrets:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not only the last commit
          persist-credentials: false
      - name: Scan git history for secrets
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS" git --redact --verbose --exit-code 1 \
            --report-format sarif --report-path gitleaks.sarif .
      - name: Upload findings to GitHub Security
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  engine:
    name: Engine (ruff, mypy, pytest) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked dependencies (hash-checked)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint
        run: ruff check --output-format=github .
      - name: Formatting
        run: ruff format --check .
      - name: Type check (mypy --strict)
        run: mypy
      - name: Validate the example scope file
        run: reconscope validate-scope examples/scope.example.yml
      - name: Tests (coverage gate 90%)
        run: pytest --cov --cov-report=term --cov-report=xml --junitxml=junit.xml
      - name: Audit runtime dependencies for known vulnerabilities
        if: runner.os == 'Linux'
        run: pip-audit --strict --require-hashes --disable-pip -r requirements.txt
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            coverage.xml
            junit.xml
          retention-days: 14

  lab:
    name: Integration (scan the docker-compose lab)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and start the lab
        working-directory: lab
        run: |
          docker compose -p reconscopelab up -d --build
      - name: Wait for the services to accept connections
        run: |
          for addr in 10.13.37.10:80 10.13.37.10:443 10.13.37.20:22 10.13.37.30:445 10.13.37.40:53 10.13.37.50:6379; do
            host=${addr%%:*}; port=${addr##*:}
            for i in $(seq 1 30); do
              if docker run --rm --network reconscopelab_lab busybox:1.37.0 \
                   sh -c "nc -z -w2 $host $port"; then echo "$addr ready"; break; fi
              if [ "$i" = "30" ]; then echo "$addr never came up"; exit 1; fi
              sleep 2
            done
          done
      - name: Run reconscope against the lab
        run: |
          docker run --rm --network reconscopelab_lab -v "$PWD":/app -w /app \
            -e PYTHONUTF8=1 python:3.12-slim bash -c '
              python -m pip install --require-hashes --no-deps -r requirements-dev.txt &&
              python -m pip install --no-deps --no-build-isolation -e . &&
              reconscope scan --scope lab/scope.lab.test.yml \
                --json report.json --html report.html \
                10.13.37.10 10.13.37.20 10.13.37.30 10.13.37.40 10.13.37.50'
      - name: Check the report found the planted issues
        run: python3 lab/check_report.py report.json
      - name: Upload the sample report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-report
          path: |
            report.json
            report.html
          retention-days: 30
      - name: Lab logs on failure
        if: failure()
        working-directory: lab
        run: docker compose -p reconscopelab logs
      - name: Tear down
        if: always()
        working-directory: lab
        run: docker compose -p reconscopelab down -v
