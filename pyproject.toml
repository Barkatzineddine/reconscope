[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "reconscope"
version = "1.0.0"
description = "Scope-bounded network and service enumeration for authorized security assessments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Mohamed Zineddine Barkat" }]
dependencies = ["pyyaml", "jinja2", "dnspython", "cryptography"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]

[project.scripts]
reconscope = "reconscope.cli:main"

[project.urls]
Repository = "https://github.com/Barkatzineddine/reconscope"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reconscope = ["templates/*", "py.typed"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "PTH", "C4", "RET"]
ignore = ["PLR2004", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S603", "S607", "S104", "S106", "SIM105", "PLC0415", "E501", "SLF001", "S505"]
# The lab report checker is a CI assertion script; asserts are exactly the point.
"lab/check_report.py" = ["S101"]
# The scanner must inspect self-signed and otherwise invalid certificates by design,
# so it negotiates TLS without verification. This is read-only and never sends data.
"src/reconscope/enum/tls.py" = ["S323"]
# Probe payloads for SSH and SMB are fixed, hand-built protocol packets, not secrets.
"src/reconscope/enum/smb.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = ["lab: integration tests that need the docker-compose lab (RECONSCOPE_LAB=1)"]
filterwarnings = ["ignore:ssl.TLSVersion.TLSv1.*is deprecated:DeprecationWarning"]

[tool.coverage.run]
source = ["reconscope"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
